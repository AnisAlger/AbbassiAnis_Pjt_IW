<h2>Liste des utilisateurs de type participant</h2>

<table *ngIf="participants.length > 0" border="1" cellpadding="8">
  <thead>
    <tr>
      <th>Nom</th>
      <th>Prénom</th>
      <th>Email</th>
      <th>Rôle</th>
      <th>ID</th>
      <th>Statut</th>
      <th>Événement inscrit</th>   <!-- 👈 NOUVELLE COLONNE -->
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let p of participants">
      <td>{{ p.lastName }}</td>
      <td>{{ p.firstName }}</td>
      <td>{{ p.email }}</td>
      <td>{{ p.role }}</td>
      <td>{{ p.id }}</td>

      <td [ngStyle]="{ color: p.status === 'inscrit' ? 'green' : 'red' }">
        {{ p.status }}
      </td>

      <!-- ✔ SI INSCRIT → AFFICHER TITRE DE L'ÉVÉNEMENT -->
      <td>
        <span *ngIf="p.status === 'inscrit'; else aucun">
          {{ p.eventTitle }}
        </span>

        <ng-template #aucun>
          -
        </ng-template>
      </td>

    </tr>
  </tbody>
</table>

<div class="back-button-container">
    <button class="back-btn" routerLink="/dashboard-organizer">
      <span class="back-icon">←</span>
      Retour au dashboard
    </button>
</div>

<p *ngIf="participants.length === 0">
  Aucun utilisateur de type participant trouvé.
</p>
