<div class="navbar" *ngIf="showNavbar">
  
  <!-- Icône Notifications à GAUCHE -->
  <div class="notif-icon" (click)="showList = !showList">
    🔔
    <span *ngIf="unreadCount > 0" class="notif-count">{{ unreadCount }}</span>
  </div>

  <!-- Espace restant pour d'autres éléments si nécessaire -->
  <div class="navbar-content">
    <!-- Vos autres éléments de navbar ici -->
  </div>

  <!-- Liste des notifications (reste à droite de l'icône) -->
  <div class="notif-list" *ngIf="showList">
    <p
      *ngFor="let n of notifications"
      [class.unread]="!n.read"
      (click)="markAsRead(n)"
    >
      {{ n.message }} <br>
      <small>{{ n.createdAt | date:'short' }}</small>
    </p>
  </div>

</div>
