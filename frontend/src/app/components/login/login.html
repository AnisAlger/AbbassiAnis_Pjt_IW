<div class="login-container">
  <div class="login-card">

    <!-- Avatar centré -->
    <div class="avatar">
      👤
    </div>

    <h2>Connexion</h2>

    <div class="form-group">
      <input type="email" [(ngModel)]="email" placeholder="Email" class="form-input">
    </div>

    <div class="form-group">
      <input type="password" [(ngModel)]="password" placeholder="Mot de passe" class="form-input">
    </div>

    <button (click)="login()" class="login-button">Se connecter</button>

  </div>
</div>
